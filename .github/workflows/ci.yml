name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          files="$(find cmd internal -name '*.go' -type f -exec gofmt -l {} +)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Linux AMD64 CLI
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o rew ./cmd/rew

  linux-e2e:
    name: Linux Docker E2E
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker availability
        run: |
          docker version
          docker info --format '{{.OSType}}/{{.Architecture}}'

      - name: Verify replay image is not preloaded
        run: |
          if docker image inspect \
            ghcr.io/rewtools/replay-base@sha256:51ea5ed5cda2f1133ed5b0c07f7f26902e0ed7f9527671a3491525bbc080c944 \
            >/dev/null 2>&1; then
            echo "Replay image is already cached; cold-pull path not tested"
            exit 1
          fi

          echo "Replay image is absent; SDK must download it"

      - name: Run Capture and Replay v2 E2E
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -o pipefail

          go test -count=1 -v ./cmd/rew \
            -run '^TestCaptureReplayV2EndToEnd$' \
            | tee /tmp/rew-e2e.log

          if grep -q -- '--- SKIP: TestCaptureReplayV2EndToEnd' /tmp/rew-e2e.log; then
            echo "E2E test was unexpectedly skipped"
            exit 1
          fi

      - name: Test Replay CLI SIGINT and cleanup
        shell: bash
        run: |
          set -o pipefail
          REW_DOCKER_TEST=1 go test \
            -count=1 \
            -v \
            -timeout 90s \
            ./cmd/rew \
            -run '^TestReplayCLISIGINT$'

      - name: Test Docker sandbox security
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -o pipefail

          go test \
            -count=1 \
            -v \
            -timeout 90s \
            ./internal/runtime/docker \
            -run '^(TestSDKContainerSecurityConfiguration|TestSDKRunSecurityRestrictions|TestSDKRunContainerHasRunID)$'

      - name: Go runtime Docker E2E
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 180s \
            ./internal/runtime/docker \
            -run '^TestSDKGoRuntimeBuildFailure$' \
            | tee /tmp/rew-go-runtime.log

          if grep -q -- '--- SKIP: TestSDKGoRuntimeBuildFailure' /tmp/rew-go-runtime.log; then
            echo "Go runtime test was unexpectedly skipped"
            exit 1
          fi

          go test -count=1 -v -timeout 180s \
            ./internal/replay \
            -run '^TestReplayV2GoBuildIntegration$' \
            | tee /tmp/rew-go-replay.log

          if grep -q -- '--- SKIP: TestReplayV2GoBuildIntegration' /tmp/rew-go-replay.log; then
            echo "Go replay test was unexpectedly skipped"
            exit 1
          fi

      - name: Go Capture to Replay E2E
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 180s \
            ./cmd/rew \
            -run '^TestCaptureReplayGoBuildEndToEnd$' \
            | tee /tmp/rew-go-capture-e2e.log

          if ! grep -q -- '--- PASS: TestCaptureReplayGoBuildEndToEnd' \
            /tmp/rew-go-capture-e2e.log; then
            echo "Go Capture/Replay E2E did not pass"
            exit 1
          fi

      - name: Schema v3 Docker runner E2E
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 8m \
            ./internal/runtime/docker \
            -run '^(TestSDKOfflineExecRunner|TestSDKOfflineExecCancelAfterCommandStarted|TestExecuteInContainerStartFailureE2E)$' \
            | tee "$RUNNER_TEMP/rew-v3-docker.log"

          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/rew-v3-docker.log"; then
            echo "Schema v3 Docker tests were unexpectedly skipped"
            exit 1
          fi

      - name: Schema v3 Replay API and CLI E2E
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 5m \
            ./internal/replay \
            -run '^TestReplayV3OfflineGoFailure$' \
            | tee "$RUNNER_TEMP/rew-v3-replay.log"

          if ! grep -q -- '--- PASS: TestReplayV3OfflineGoFailure' \
            "$RUNNER_TEMP/rew-v3-replay.log"; then
            echo "Schema v3 Replay E2E did not pass"
            exit 1
          fi

          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/rew-v3-replay.log"; then
            echo "Schema v3 Replay E2E was unexpectedly skipped"
            exit 1
          fi

      - name: Schema v3 Snapshot Docker E2E
        shell: bash
        env:
          REW_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 12m \
            ./internal/runtime/docker \
            -run '^(TestSnapshotVolumes.*|TestSnapshotReadersDocker.*|TestSnapshotExecutorEndToEnd|TestSnapshotOfflineGoBuild)$' \
            | tee "$RUNNER_TEMP/rew-v3-snapshot.log"

          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/rew-v3-snapshot.log"; then
            echo "Snapshot Docker tests were unexpectedly skipped"
            exit 1
          fi

  macos-capture:
    name: macOS ARM64 Go Capture
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify host platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          go version

      - name: Test Go Capture and environment metadata
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
        run: |
          set -euo pipefail

          go test -count=1 -v \
            ./cmd/rew \
            -run '^TestCaptureV2DetectsGoRuntime$' \
            | tee /tmp/rew-macos-capture.log

          if ! grep -q -- '--- PASS: TestCaptureV2DetectsGoRuntime' \
            /tmp/rew-macos-capture.log; then
            echo "macOS Go Capture test did not pass"
            exit 1
          fi

      - name: Schema v3 Capture tests on macOS ARM64
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 3m \
            ./cmd/rew \
            -run '^TestCaptureV3' \
            | tee "$RUNNER_TEMP/rew-v3-macos-capture.log"

          if grep -q -- '--- FAIL:\|--- SKIP:' \
            "$RUNNER_TEMP/rew-v3-macos-capture.log"; then
            echo "Schema v3 macOS Capture tests failed or skipped"
            exit 1
          fi

          if ! grep -q -- '--- PASS: TestCaptureV3CreatesVerifiedCapsule' \
            "$RUNNER_TEMP/rew-v3-macos-capture.log"; then
            echo "Schema v3 Capture test did not pass"
            exit 1
          fi


  cross-platform-capture:
    name: Cross-platform Go Capture
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build REW CLI
        run: go build -o rew ./cmd/rew

      - name: Capture Go compilation failure
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -euo pipefail

          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

          cd testdata/cross-platform-go

          capture_stdout="$RUNNER_TEMP/cross-platform-capture.stdout"
          capture_stderr="$RUNNER_TEMP/cross-platform-capture.stderr"

          set +e
          ../../rew capture \
            --include go.mod \
            --include main.go \
            -- go build ./... \
            > "$capture_stdout" 2> "$capture_stderr"
          capture_exit=$?
          set -e

          if [ "$capture_exit" -ne 1 ] || [ ! -s failure.bfc ]; then
            echo "Cross-platform capture failed validation (exit=$capture_exit)"
            cat "$capture_stdout"
            cat "$capture_stderr" >&2
            exit 1
          fi

          echo "Expected compiler failure captured successfully"
          cp failure.bfc "$RUNNER_TEMP/cross-platform-go.bfc"

          echo "macOS capsule created successfully"

      - name: Upload captured capsule
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-go-capsule
          path: ${{ runner.temp }}/cross-platform-go.bfc
          if-no-files-found: error
          retention-days: 7

  cross-platform-replay:
    name: Cross-platform Go Replay
    runs-on: ubuntu-24.04
    needs: cross-platform-capture

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download macOS capsule
        uses: actions/download-artifact@v6
        with:
          name: cross-platform-go-capsule
          path: ${{ runner.temp }}/rew-capsule

      - name: Build REW CLI
        run: go build -o rew ./cmd/rew

      - name: Replay macOS capsule in Linux Docker
        shell: bash
        run: |
          set -euo pipefail

          capsule="$RUNNER_TEMP/rew-capsule/cross-platform-go.bfc"
          test -s "$capsule"

          docker version

          set +e
          ./rew replay --v2 --allow-command "$capsule" \
            > "$RUNNER_TEMP/replay.stdout" \
            2> "$RUNNER_TEMP/replay.stderr"
          replay_exit=$?
          set -e

          echo "Replay exit code: $replay_exit"
          cat "$RUNNER_TEMP/replay.stdout"
          cat "$RUNNER_TEMP/replay.stderr"

          if [ "$replay_exit" -ne 0 ]; then
            echo "REW Replay failed"
            exit 1
          fi

          if ! grep -qi 'reproduced' "$RUNNER_TEMP/replay.stdout" \
             && ! grep -qi 'reproduced' "$RUNNER_TEMP/replay.stderr"; then
            echo "Expected REPRODUCED outcome"
            exit 1
          fi

  cross-platform-v3-capture:
    name: Schema v3 Capture on macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify host architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          go version

      - name: Build REW CLI
        run: go build -o rew ./cmd/rew

      - name: Capture real Go dependency failure
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail

          cd testdata/cross-platform-go-v3

          # Download the exact dependency and record both checksums.
          go mod download github.com/google/uuid@v1.6.0
          go mod download

          test -s go.sum

          grep -q '^github.com/google/uuid v1.6.0 h1:' go.sum
          grep -q '^github.com/google/uuid v1.6.0/go.mod h1:' go.sum

          # Capture must not need a module proxy.
          export GOPROXY=off
          export GOSUMDB=off

          capture_stdout="$RUNNER_TEMP/v3-capture.stdout"
          capture_stderr="$RUNNER_TEMP/v3-capture.stderr"

          set +e
          ../../rew capture --v3 \
            --include go.mod \
            --include go.sum \
            --include main.go \
            -- go build ./... \
            > "$capture_stdout" 2> "$capture_stderr"
          capture_exit=$?
          set -e

          if [ "$capture_exit" -ne 1 ] || [ ! -s failure.rew ]; then
            echo "Schema-v3 capture failed validation (exit=$capture_exit)"
            cat "$capture_stdout"
            cat "$capture_stderr" >&2
            exit 1
          fi

          echo "Expected schema-v3 compiler failure captured successfully"

          cp failure.rew "$RUNNER_TEMP/rew-v3.rew"

      - name: Upload schema v3 capsule
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-go-v3-capsule
          path: ${{ runner.temp }}/rew-v3.rew
          if-no-files-found: error
          retention-days: 7

  cross-platform-v3-replay:
    name: Schema v3 Replay on Linux AMD64
    runs-on: ubuntu-24.04
    needs: cross-platform-v3-capture

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download macOS capsule
        uses: actions/download-artifact@v6
        with:
          name: cross-platform-go-v3-capsule
          path: ${{ runner.temp }}/rew-v3

      - name: Build REW CLI
        run: go build -o rew ./cmd/rew

      - name: Replay transferred capsule offline
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

          docker version

          capsule="$RUNNER_TEMP/rew-v3/rew-v3.rew"
          test -s "$capsule"

          set +e
          ./rew replay --v3 --allow-command "$capsule" \
            > "$RUNNER_TEMP/v3-replay.stdout" \
            2> "$RUNNER_TEMP/v3-replay.stderr"
          replay_exit=$?
          set -e

          cat "$RUNNER_TEMP/v3-replay.stdout"
          cat "$RUNNER_TEMP/v3-replay.stderr"

          if [ "$replay_exit" -ne 0 ]; then
            echo "Schema v3 replay failed: $replay_exit"
            exit 1
          fi

          if ! grep -q 'Outcome: *reproduced' \
            "$RUNNER_TEMP/v3-replay.stdout"; then
            echo "Expected reproduced outcome"
            exit 1
          fi

          echo "CROSS-PLATFORM SCHEMA V3: PASS"

  cross-platform-go125-capture:
    name: Go 1.25.14 Schema v3 Capture on macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up REW build toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify macOS ARM64 and build REW
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          go version
          GOTOOLCHAIN=local go build -o rew ./cmd/rew

      - name: Install exact Go 1.25.14 toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false

      - name: Capture Go 1.25.14 compiler failure
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOFLAGS: ""
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          set -euo pipefail

          test "$(go version)" = "go version go1.25.14 darwin/arm64"

          project="$RUNNER_TEMP/rew-go125-project"
          mkdir -p "$project"

          cat > "$project/go.mod" <<'MOD'
          module example.com/rew-go125-ci

          go 1.25
          MOD

          cat > "$project/main.go" <<'GO'
          package main

          func main() {
              undefinedREWSymbol()
          }
          GO

          cd "$project"

          set +e
          "$GITHUB_WORKSPACE/rew" capture --v3 \
            --include-go-sources \
            -- go build ./... \
            > "$RUNNER_TEMP/go125-capture.stdout" \
            2> "$RUNNER_TEMP/go125-capture.stderr"
          capture_exit=$?
          set -e

          cat "$RUNNER_TEMP/go125-capture.stdout"
          cat "$RUNNER_TEMP/go125-capture.stderr"

          if [ "$capture_exit" -ne 1 ] || [ ! -s failure.rew ]; then
            echo "Go 1.25.14 capture failed: exit=$capture_exit"
            exit 1
          fi

          python3 - failure.rew <<'PYVERIFY'
          import json
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:*") as archive:
              f = archive.extractfile("manifest.json")
              assert f is not None
              manifest = json.load(f)

          assert manifest["schema_version"] == 3
          assert manifest["runtime"] == {
              "kind": "go",
              "version": "1.25.14",
          }

          print("PASS: schema-v3 capsule records Go 1.25.14")
          PYVERIFY

          cp failure.rew "$RUNNER_TEMP/rew-go125.rew"

      - name: Upload Go 1.25.14 capsule
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-go125-v3-capsule
          path: ${{ runner.temp }}/rew-go125.rew
          if-no-files-found: error
          retention-days: 7

  cross-platform-go125-replay:
    name: Go 1.25.14 Schema v3 Replay on Linux AMD64
    runs-on: ubuntu-24.04
    needs: cross-platform-go125-capture

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up REW build toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build REW CLI
        run: GOTOOLCHAIN=local go build -o rew ./cmd/rew

      - name: Download Go 1.25.14 capsule
        uses: actions/download-artifact@v6
        with:
          name: cross-platform-go125-v3-capsule
          path: ${{ runner.temp }}/rew-go125

      - name: Replay Go 1.25.14 capsule offline
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

          docker version

          capsule="$RUNNER_TEMP/rew-go125/rew-go125.rew"
          test -s "$capsule"

          set +e
          ./rew replay --v3 --allow-command \
            --memory 1g \
            "$capsule" \
            > "$RUNNER_TEMP/go125-replay.stdout" \
            2> "$RUNNER_TEMP/go125-replay.stderr"
          replay_exit=$?
          set -e

          cat "$RUNNER_TEMP/go125-replay.stdout"
          cat "$RUNNER_TEMP/go125-replay.stderr"

          if [ "$replay_exit" -ne 0 ]; then
            echo "Go 1.25.14 replay failed: exit=$replay_exit"
            exit 1
          fi

          if ! grep -q 'Outcome: *reproduced' \
            "$RUNNER_TEMP/go125-replay.stdout"; then
            echo "Expected reproduced outcome for Go 1.25.14"
            exit 1
          fi

          if ! grep -q 'Original exit code: *1' \
            "$RUNNER_TEMP/go125-replay.stdout"; then
            echo "Original exit code mismatch"
            exit 1
          fi

          if ! grep -q 'Replay exit code: *1' \
            "$RUNNER_TEMP/go125-replay.stdout"; then
            echo "Replay exit code mismatch"
            exit 1
          fi

          echo "GO 1.25.14 CROSS-PLATFORM SCHEMA V3: PASS"
